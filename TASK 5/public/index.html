<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Boxicons for modern icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <h1>Task Manager Pro</h1>
                <p>Manage your tasks seamlessly with our RESTful API</p>
            </div>
            <button id="addBtn" class="btn btn-primary" onclick="openModal('add')">
                <i class='bx bx-plus'></i> New Task
            </button>
        </header>

        <main>
            <!-- Loading Indicator -->
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <p>Fetching data from API...</p>
            </div>

            <!-- Dashboard Stats -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon"><i class='bx bx-list-ul'></i></div>
                    <div class="stat-info">
                        <h3>Total Tasks</h3>
                        <p id="totalTasks">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon pending"><i class='bx bx-time-five'></i></div>
                    <div class="stat-info">
                        <h3>Pending</h3>
                        <p id="pendingTasks">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon completed"><i class='bx bx-check-circle'></i></div>
                    <div class="stat-info">
                        <h3>Completed</h3>
                        <p id="completedTasks">0</p>
                    </div>
                </div>
            </div>

            <!-- Task List -->
            <div class="task-grid" id="taskGrid">
                <!-- Tasks will be injected here via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Modal for Create/Update -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="e.g., Design UI" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" placeholder="Provide details..." rows="3" required></textarea>
                </div>
                <div class="form-group" id="statusGroup" style="display: none;">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Task</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
